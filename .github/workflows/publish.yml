name: Publish NuGet Package

on:
  release:
    types: [created]

env:
  VERSION: ${{ github.ref_name }}
  BUILD_CONFIGURATION: Release

jobs:
  publish:
    runs-on: windows-latest
    environment: NuGet Deploy
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        working-directory: src/IgniteUI.Blazor.GridLite

      - run: npm run build
        working-directory: src/IgniteUI.Blazor.GridLite

      - name: Restore dependencies
        run: dotnet restore src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Restore strong-name key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.IG_STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "The IG_STRONG_NAME_KEY organization secret is empty or unavailable to this repository."
          }

          $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
          [System.IO.File]::WriteAllBytes("${{ runner.temp }}\IG.StrongName.snk", $keyBytes)

      - name: Build strong-named assemblies
        shell: pwsh
        run: |
          dotnet build src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            -p:Version=${{ env.VERSION }} `
            -p:RunNodeBuild=false `
            -p:GeneratePackageOnBuild=false `
            -p:SignAssembly=true `
            -p:AssemblyOriginatorKeyFile="${{ runner.temp }}\IG.StrongName.snk"

      - name: Delete strong-name key
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\IG.StrongName.snk" -Force -ErrorAction SilentlyContinue

      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/src/IgniteUI.Blazor.GridLite/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --verbosity Warning

      - name: Validate DLL signatures
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Path "${{ github.workspace }}/src/IgniteUI.Blazor.GridLite/bin/${{ env.BUILD_CONFIGURATION }}" -Filter "*.dll" -Recurse
          if (-not $dlls -or $dlls.Count -eq 0) {
            Write-Error "No DLLs found under '${{ github.workspace }}/src/IgniteUI.Blazor.GridLite/bin/${{ env.BUILD_CONFIGURATION }}' to validate."
            exit 1
          }
          $failed = @()
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid') {
              $failed += $dll.FullName
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Unsigned DLLs found:`n$($failed -join "`n")"
            exit 1
          }
          Write-Host "All DLLs signed successfully."

      - name: Pack NuGet package
        run: dotnet pack src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --no-restore -p:PackageVersion=${{ env.VERSION }} -o ./artifacts

      - name: Validate packaged assembly strong names
        shell: pwsh
        run: |
          $packagePath = "${{ github.workspace }}\artifacts\IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg"
          $validationRoot = "${{ runner.temp }}\strong-name-validation"
          $archivePath = "$validationRoot\package.zip"
          $extractPath = "$validationRoot\package"

          try {
            if (-not (Test-Path $packagePath)) {
              throw "NuGet package not found: $packagePath"
            }

            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item $packagePath $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

            $assemblies = @(Get-ChildItem -Path $extractPath -Filter "*.dll" -Recurse)
            if ($assemblies.Count -eq 0) {
              throw "No assemblies were found in the NuGet package."
            }

            $windowsSdkRoot = Join-Path ${env:ProgramFiles(x86)} "Microsoft SDKs\Windows"
            $strongNameTool = Get-ChildItem -Path $windowsSdkRoot -Filter "sn.exe" -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $strongNameTool) {
              throw "Could not find sn.exe in the Windows SDK."
            }

            foreach ($assembly in $assemblies) {
              & $strongNameTool.FullName -vf $assembly.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Strong-name verification failed: $($assembly.FullName)"
              }
            }

            Write-Host "Verified $($assemblies.Count) strong-name signed package assemblies."
          }
          finally {
            Remove-Item $validationRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/artifacts"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg"
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1
        id: login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      # Push the package
      - name: NuGet push
        run: dotnet nuget push artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source "https://api.nuget.org/v3/index.json"
