name: Publish NuGet Package

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '10.0.x'
  VERSION: ${{ github.ref_name }}
  # Public, deliberately pinned identity. The strong-name counterpart lives in eng/IG.publickey.hex.
  EXPECTED_CERT_SUBJECT_CN: 'Infragistics, Inc.'

jobs:
  # Holds the strong-name key, but no OIDC token, no Key Vault access and no publishing rights.
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.checksums.outputs.manifest-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore JavaScript dependencies
        run: npm ci
        working-directory: src/IgniteUI.Blazor.GridLite

      - name: Build JavaScript bundle
        run: npm run build
        working-directory: src/IgniteUI.Blazor.GridLite

      - name: Restore .NET dependencies
        run: dotnet restore src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj

      - name: Restore strong-name key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.IG_STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "The IG_STRONG_NAME_KEY organization secret is empty or unavailable to this repository."
          }

          $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
          [System.IO.File]::WriteAllBytes("${{ runner.temp }}\IG.StrongName.snk", $keyBytes)

      - name: Build strong-named assemblies
        shell: pwsh
        run: |
          dotnet build src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            -p:Version=${{ env.VERSION }} `
            -p:RunNodeBuild=false `
            -p:GeneratePackageOnBuild=false `
            -p:SignAssembly=true `
            -p:AssemblyOriginatorKeyFile="${{ runner.temp }}\IG.StrongName.snk"

      - name: Delete strong-name key
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\IG.StrongName.snk" -Force -ErrorAction SilentlyContinue

      - name: Record build output checksums
        id: checksums
        shell: pwsh
        run: >
          .github/scripts/artifact-checksums.ps1 -Mode Write -ManifestPath build-output.sha256
          -Path src/IgniteUI.Blazor.GridLite/bin, src/IgniteUI.Blazor.GridLite/obj,
          src/IgniteUI.Blazor.GridLite/wwwroot/js, src/IgniteUI.Blazor.GridLite/wwwroot/css/themes

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            src/IgniteUI.Blazor.GridLite/bin/**
            src/IgniteUI.Blazor.GridLite/obj/**
            src/IgniteUI.Blazor.GridLite/wwwroot/js/**
            src/IgniteUI.Blazor.GridLite/wwwroot/css/themes/**
            build-output.sha256
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  sign-assemblies:
    name: Sign assemblies
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: NuGet Deploy
    permissions:
      contents: read
      id-token: write
    outputs:
      manifest-sha256: ${{ steps.checksums.outputs.manifest-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .

      - name: Verify build output
        shell: pwsh
        env:
          EXPECTED_MANIFEST_HASH: ${{ needs.build.outputs.manifest-sha256 }}
        run: >
          .github/scripts/artifact-checksums.ps1 -Mode Verify -ManifestPath build-output.sha256
          -Path src/IgniteUI.Blazor.GridLite/bin, src/IgniteUI.Blazor.GridLite/obj,
          src/IgniteUI.Blazor.GridLite/wwwroot/js, src/IgniteUI.Blazor.GridLite/wwwroot/css/themes
          -ExpectedManifestHash $env:EXPECTED_MANIFEST_HASH

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/src/IgniteUI.Blazor.GridLite/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --verbosity Warning

      - name: Validate DLL signatures
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem -Path "${{ github.workspace }}\src\IgniteUI.Blazor.GridLite\bin\${{ env.BUILD_CONFIGURATION }}" -Filter '*.dll' -Recurse -File)
          if ($dlls.Count -eq 0) {
            throw "No DLLs found to validate."
          }

          $failed = @()
          $thumbprints = @{}
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid') {
              $failed += "$($dll.FullName): signature status $($sig.Status)."
              continue
            }

            $cn = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            if ($cn -ne $env:EXPECTED_CERT_SUBJECT_CN) {
              $failed += "$($dll.FullName): signed by '$cn', expected '$($env:EXPECTED_CERT_SUBJECT_CN)'."
              continue
            }

            $thumbprints[$sig.SignerCertificate.Thumbprint] = $true
          }
          if ($failed.Count -gt 0) {
            throw "Authenticode validation failed:`n$($failed -join "`n")"
          }

          Write-Host "All $($dlls.Count) DLLs signed by '$($env:EXPECTED_CERT_SUBJECT_CN)'."
          @(
            "### Authenticode signer",
            "- Subject CN: $($env:EXPECTED_CERT_SUBJECT_CN)",
            "- Thumbprint: $($thumbprints.Keys -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Record signed assembly checksums
        id: checksums
        shell: pwsh
        run: >
          .github/scripts/artifact-checksums.ps1 -Mode Write -ManifestPath signed-assemblies.sha256
          -Path src/IgniteUI.Blazor.GridLite/bin, src/IgniteUI.Blazor.GridLite/obj,
          src/IgniteUI.Blazor.GridLite/wwwroot/js, src/IgniteUI.Blazor.GridLite/wwwroot/css/themes

      - name: Upload signed assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-assemblies
          path: |
            src/IgniteUI.Blazor.GridLite/bin/**
            src/IgniteUI.Blazor.GridLite/obj/**
            src/IgniteUI.Blazor.GridLite/wwwroot/js/**
            src/IgniteUI.Blazor.GridLite/wwwroot/css/themes/**
            signed-assemblies.sha256
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack and sign package
    needs: sign-assemblies
    runs-on: windows-latest
    timeout-minutes: 20
    environment: NuGet Deploy
    permissions:
      contents: read
      id-token: write
    outputs:
      nupkg-sha256: ${{ steps.digest.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-assemblies
          path: .

      - name: Verify signed assemblies
        shell: pwsh
        env:
          EXPECTED_MANIFEST_HASH: ${{ needs.sign-assemblies.outputs.manifest-sha256 }}
        run: >
          .github/scripts/artifact-checksums.ps1 -Mode Verify -ManifestPath signed-assemblies.sha256
          -Path src/IgniteUI.Blazor.GridLite/bin, src/IgniteUI.Blazor.GridLite/obj,
          src/IgniteUI.Blazor.GridLite/wwwroot/js, src/IgniteUI.Blazor.GridLite/wwwroot/css/themes
          -ExpectedManifestHash $env:EXPECTED_MANIFEST_HASH

      - name: Pack NuGet package
        run: >
          dotnet pack src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          -p:PackageVersion=${{ env.VERSION }}
          -o "${{ github.workspace }}/artifacts"

      - name: Validate packaged assembly strong names
        shell: pwsh
        run: |
          $packagePath = "${{ github.workspace }}\artifacts\IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $validationRoot = "${{ runner.temp }}\strong-name-validation"
          $archivePath = "$validationRoot\package.zip"
          $extractPath = "$validationRoot\package"

          try {
            if (-not (Test-Path $packagePath)) {
              throw "NuGet package not found: $packagePath"
            }

            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item $packagePath $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

            .github/scripts/verify-strong-name.ps1 -Path $extractPath -ExpectedPublicKeyPath eng/IG.publickey.hex
          }
          finally {
            Remove-Item $validationRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/artifacts"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: Record package digest
        id: digest
        shell: pwsh
        run: |
          $name = "IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $package = "${{ github.workspace }}\artifacts\$name"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          "$digest  $name" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          @("### Signed package digest", '```', "$digest  $name", '```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-signed
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It compiles nothing and never checks out the repository.
  publish:
    name: Publish to NuGet.org
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 15
    environment: NuGet Deploy
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify signed package digest
        shell: pwsh
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($digest -ne $env:EXPECTED_NUPKG_SHA256) {
            throw "Refusing to publish: expected digest $($env:EXPECTED_NUPKG_SHA256) but found $digest."
          }

          Write-Host "Publishing package with digest $digest."

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "${{ github.workspace }}/artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
