name: Publish NuGet Package

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '10.0.x'
  VERSION: ${{ github.ref_name }}
  # Public, deliberately pinned identity. The strong-name counterpart lives in eng/IG.publickey.hex.
  EXPECTED_CERT_SHA256_PATH: 'eng/IG.authenticode-certificates.sha256'
  # Bound sbom-tool's external license lookup.
  SBOM_LICENSE_TIMEOUT_SECONDS: '180'

jobs:
  # Holds the strong-name key, but no OIDC token, no Key Vault access and no publishing rights.
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore JavaScript dependencies
        run: npm ci
        working-directory: src/IgniteUI.Blazor.GridLite

      - name: Build JavaScript bundle
        run: npm run build
        working-directory: src/IgniteUI.Blazor.GridLite

      - name: Restore .NET dependencies
        run: dotnet restore src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj

      - name: Restore strong-name key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.IG_STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "The IG_STRONG_NAME_KEY organization secret is empty or unavailable to this repository."
          }

          $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
          [System.IO.File]::WriteAllBytes("${{ runner.temp }}\IG.StrongName.snk", $keyBytes)

      - name: Build strong-named assemblies
        shell: pwsh
        run: |
          dotnet build src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            -p:Version=${{ env.VERSION }} `
            -p:RunNodeBuild=false `
            -p:GeneratePackageOnBuild=false `
            -p:SignAssembly=true `
            -p:AssemblyOriginatorKeyFile="${{ runner.temp }}\IG.StrongName.snk"

      - name: Delete strong-name key
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\IG.StrongName.snk" -Force -ErrorAction SilentlyContinue

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            src/IgniteUI.Blazor.GridLite/bin/**
            src/IgniteUI.Blazor.GridLite/obj/**
            src/IgniteUI.Blazor.GridLite/wwwroot/js/**
            src/IgniteUI.Blazor.GridLite/wwwroot/css/themes/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  sign-assemblies:
    name: Sign assemblies
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: NuGet Deploy
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: src/IgniteUI.Blazor.GridLite
          digest-mismatch: error

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/src/IgniteUI.Blazor.GridLite/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --verbosity Warning

      - name: Validate DLL signatures
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem -Path "${{ github.workspace }}\src\IgniteUI.Blazor.GridLite\bin\${{ env.BUILD_CONFIGURATION }}" -Filter '*.dll' -Recurse -File)
          if ($dlls.Count -eq 0) {
            throw "No DLLs found to validate."
          }

          $allowedFingerprints = @(
            Get-Content -LiteralPath $env:EXPECTED_CERT_SHA256_PATH |
              ForEach-Object { $_.Trim().ToUpperInvariant() } |
              Where-Object { $_ -and -not $_.StartsWith('#') }
          )
          if ($allowedFingerprints.Count -eq 0 -or @($allowedFingerprints | Where-Object { $_ -notmatch '^[0-9A-F]{64}$' }).Count -gt 0) {
            throw "$($env:EXPECTED_CERT_SHA256_PATH) must contain at least one valid SHA-256 certificate fingerprint."
          }

          $failed = @()
          $fingerprints = @{}
          $signerNames = @{}
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid') {
              $failed += "$($dll.FullName): signature status $($sig.Status)."
              continue
            }

            $cn = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            $fingerprint = [Convert]::ToHexString(
              [System.Security.Cryptography.SHA256]::HashData($sig.SignerCertificate.RawData)
            )
            if ($fingerprint -notin $allowedFingerprints) {
              $failed += "$($dll.FullName): certificate SHA-256 fingerprint $fingerprint is not approved by '$($env:EXPECTED_CERT_SHA256_PATH)'."
              continue
            }

            $fingerprints[$fingerprint] = $true
            $signerNames[$cn] = $true
          }
          if ($failed.Count -gt 0) {
            throw "Authenticode validation failed:`n$($failed -join "`n")"
          }

          Write-Host "All $($dlls.Count) DLLs signed by an approved certificate."
          @(
            "### Authenticode signer",
            "- Subject CN: $($signerNames.Keys -join ', ')",
            "- SHA-256 fingerprint: $($fingerprints.Keys -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-assemblies
          path: |
            src/IgniteUI.Blazor.GridLite/bin/**
            src/IgniteUI.Blazor.GridLite/obj/**
            src/IgniteUI.Blazor.GridLite/wwwroot/js/**
            src/IgniteUI.Blazor.GridLite/wwwroot/css/themes/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack and sign package
    needs: sign-assemblies
    runs-on: windows-latest
    timeout-minutes: 20
    environment: NuGet Deploy
    permissions:
      contents: read
      id-token: write
    outputs:
      nupkg-sha256: ${{ steps.digest.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-assemblies
          path: src/IgniteUI.Blazor.GridLite
          digest-mismatch: error

      - name: Pack NuGet package
        run: >
          dotnet pack src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          -p:PackageVersion=${{ env.VERSION }}
          -o "${{ github.workspace }}/artifacts"

      - name: Validate packaged assembly strong names
        shell: pwsh
        run: |
          $packagePath = "${{ github.workspace }}\artifacts\IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $validationRoot = "${{ runner.temp }}\strong-name-validation"
          $archivePath = "$validationRoot\package.zip"
          $extractPath = "$validationRoot\package"

          try {
            if (-not (Test-Path $packagePath)) {
              throw "NuGet package not found: $packagePath"
            }

            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item $packagePath $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

            .github/scripts/verify-strong-name.ps1 -Path $extractPath -ExpectedPublicKeyPath eng/IG.publickey.hex
          }
          finally {
            Remove-Item $validationRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/artifacts"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: Record package digest
        id: digest
        shell: pwsh
        run: |
          $name = "IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $package = "${{ github.workspace }}\artifacts\$name"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          "$digest  $name" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          @("### Signed package digest", '```', "$digest  $name", '```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-signed
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: Generate SBOM and attest
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attested-sha256: ${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify signed package digest
        shell: pwsh
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($digest -ne $env:EXPECTED_NUPKG_SHA256) {
            throw "Package digest changed between jobs. Expected $($env:EXPECTED_NUPKG_SHA256) but found $digest."
          }

          Write-Host "Verified package digest $digest."

      - name: Restore .NET dependencies
        run: dotnet restore src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj

      # sbom-tool's component detector needs node_modules to see the JavaScript dependency graph too.
      - name: Restore JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: src/IgniteUI.Blazor.GridLite

      # Dedicated nested manifest keeps sbom-tool out of the root 'dotnet tool restore' used by the sign steps.
      - name: Restore sbom-tool (pinned)
        run: dotnet tool restore --tool-manifest .config/sbom-tool/dotnet-tools.json

      # -b is the signed package folder, so the shipped nupkg and its hash land in the SBOM's files section.
      # -bc scans the library project (NuGet + npm) for the dependency graph; -li/-pm resolve license and supplier metadata.
      - name: Generate SBOMs
        working-directory: .config/sbom-tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $formats = @(
            @{ Version = 'SPDX:2.2'; Output = 'spdx-2.2' },
            @{ Version = 'SPDX:3.0'; Output = 'spdx-3.0' }
          )

          foreach ($format in $formats) {
            $manifestDirectory = Join-Path $env:GITHUB_WORKSPACE "sbom\$($format.Output)"
            # sbom-tool requires the manifest directory to exist before generation.
            New-Item -ItemType Directory -Path $manifestDirectory -Force | Out-Null

            Write-Host "Generating $($format.Version) SBOM..."
            dotnet tool run sbom-tool -- generate `
              -b "$env:GITHUB_WORKSPACE\artifacts" `
              -bc "$env:GITHUB_WORKSPACE\src\IgniteUI.Blazor.GridLite" `
              -m $manifestDirectory `
              -pn IgniteUI.Blazor.GridLite `
              -pv $env:VERSION `
              -ps Infragistics `
              -nsb http://spdx.org/spdxdocs/IgniteUI.Blazor.GridLite `
              -mi $format.Version `
              -li true `
              -lto $env:SBOM_LICENSE_TIMEOUT_SECONDS `
              -pm true `
              -V Information
          }

      - name: Verify SBOM output
        shell: pwsh
        run: |
          $name = "IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $spdx22 = "${{ github.workspace }}\sbom\spdx-2.2\_manifest\spdx_2.2\manifest.spdx.json"
          $spdx30 = "${{ github.workspace }}\sbom\spdx-3.0\_manifest\spdx_3.0\manifest.spdx.json"

          foreach ($manifestPath in @($spdx22, $spdx30)) {
            if (-not (Test-Path -LiteralPath $manifestPath) -or (Get-Item -LiteralPath $manifestPath).Length -eq 0) {
              throw "SBOM manifest missing or empty: $manifestPath"
            }
          }

          $spdx = Get-Content -LiteralPath $spdx22 -Raw | ConvertFrom-Json
          if (-not ($spdx.files | Where-Object { $_.fileName -like "*$name" })) {
            throw "The SPDX 2.2 document does not reference $name."
          }

          Write-Host "SBOM covers $($spdx.packages.Count) packages and $($spdx.files.Count) files."

      - name: Reverify package before attestation
        id: verify-before-attestation
        shell: pwsh
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($digest -ne $env:EXPECTED_NUPKG_SHA256) {
            throw "Package changed before attestation. Expected $($env:EXPECTED_NUPKG_SHA256) but found $digest."
          }

          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Verified package digest $digest immediately before attestation."

      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

      # actions/attest derives the predicate from an SPDX 2.x or CycloneDX document; SPDX 3.0 ships as evidence only.
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}
          sbom-path: sbom/spdx-2.2/_manifest/spdx_2.2/manifest.spdx.json

      - name: Collect attestation bundles
        shell: pwsh
        run: |
          $target = "${{ github.workspace }}\sbom\attestations"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "${{ steps.attest-provenance.outputs.bundle-path }}" (Join-Path $target 'provenance.sigstore.json')
          Copy-Item "${{ steps.attest-sbom.outputs.bundle-path }}" (Join-Path $target 'sbom.sigstore.json')

          @(
            "### Attestations",
            "- Provenance: ${{ steps.attest-provenance.outputs.attestation-url }}",
            "- SBOM: ${{ steps.attest-sbom.outputs.attestation-url }}"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload SBOM and attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/**
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It compiles nothing and never checks out the repository.
  publish:
    name: Publish to NuGet.org
    needs: [pack, sbom]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: NuGet Deploy
    permissions:
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify the package that was packed, signed, and attested
        shell: pwsh
        env:
          PACK_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
          ATTESTED_NUPKG_SHA256: ${{ needs.sbom.outputs.attested-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\IgniteUI.Blazor.GridLite.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          foreach ($expected in @($env:PACK_NUPKG_SHA256, $env:ATTESTED_NUPKG_SHA256)) {
            if ($digest -ne $expected) {
              throw "Refusing to publish: expected digest $expected but found $digest."
            }
          }

          Write-Host "Publishing package with digest $digest."

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "${{ github.workspace }}/artifacts/IgniteUI.Blazor.GridLite.${{ env.VERSION }}.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"

  attach-to-release:
    name: Attach release evidence
    needs: [pack, sbom, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Download SBOM and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKAGE_ID: IgniteUI.Blazor.GridLite
        run: |
          set -euo pipefail

          (cd sbom/spdx-2.2/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-2.2.zip" .)
          (cd sbom/spdx-3.0/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-3.0.zip" .)

          gh release upload "$TAG" --clobber -R "${{ github.repository }}" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg.sha256" \
            "${PACKAGE_ID}.${TAG}.spdx-2.2.zip" \
            "${PACKAGE_ID}.${TAG}.spdx-3.0.zip" \
            "sbom/attestations/provenance.sigstore.json" \
            "sbom/attestations/sbom.sigstore.json"
