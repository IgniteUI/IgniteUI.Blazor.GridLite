name: Publish NuGet Package

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '10.0.x'
  VERSION: ${{ github.ref_name }}
  PACKAGE_ID: IgniteUI.Blazor.GridLite
  PROJECT_PATH: src/IgniteUI.Blazor.GridLite/IgniteUI.Blazor.GridLite.csproj
  PROJECT_DIR: src/IgniteUI.Blazor.GridLite
  REPOSITORY_URL: https://github.com/IgniteUI/IgniteUI.Blazor.GridLite
  # Public, deliberately pinned identities.
  EXPECTED_CERT_SHA256_PATH: 'eng/IG.authenticode-certificates.sha256'
  EXPECTED_PUBLIC_KEY_PATH: 'eng/IG.publickey.hex'
  # Bound sbom-tool's external license lookup.
  SBOM_LICENSE_TIMEOUT_SECONDS: '180'

jobs:
  # Holds the strong-name key, but no OIDC token, no Key Vault access and no publishing rights.
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: Release build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: pwsh
        run: .github/scripts/Assert-ReleaseVersion.ps1 -Version "$env:VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore JavaScript dependencies
        run: npm ci
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build JavaScript bundle
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Restore .NET dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Restore strong-name key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.IG_STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "The IG_STRONG_NAME_KEY organization secret is empty or unavailable to this repository."
          }

          $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
          [System.IO.File]::WriteAllBytes("${{ runner.temp }}\IG.StrongName.snk", $keyBytes)

      - name: Build strong-named assemblies
        shell: pwsh
        run: >
          dotnet build ${{ env.PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          "-p:Version=$env:VERSION"
          -p:RunNodeBuild=false
          -p:GeneratePackageOnBuild=false
          -p:ContinuousIntegrationBuild=true
          -p:SignAssembly=true
          -p:AssemblyOriginatorKeyFile="${{ runner.temp }}\IG.StrongName.snk"

      - name: Delete strong-name key
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\IG.StrongName.snk" -Force -ErrorAction SilentlyContinue

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            src/IgniteUI.Blazor.GridLite/bin/**
            src/IgniteUI.Blazor.GridLite/obj/**
            src/IgniteUI.Blazor.GridLite/wwwroot/js/**
            src/IgniteUI.Blazor.GridLite/wwwroot/css/themes/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  sign-assemblies:
    name: Sign assemblies
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: NuGet Deploy
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: src/IgniteUI.Blazor.GridLite
          digest-mismatch: error

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/src/IgniteUI.Blazor.GridLite/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --verbosity Warning

      - name: Validate DLL signatures
        shell: pwsh
        run: >
          .github/scripts/Assert-AuthenticodeSignature.ps1
          -Path "${{ github.workspace }}/${{ env.PROJECT_DIR }}/bin/${{ env.BUILD_CONFIGURATION }}"
          -ExpectedCertificateSha256Path "${{ env.EXPECTED_CERT_SHA256_PATH }}"

      - name: Upload signed assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-assemblies
          path: |
            src/IgniteUI.Blazor.GridLite/bin/**
            src/IgniteUI.Blazor.GridLite/obj/**
            src/IgniteUI.Blazor.GridLite/wwwroot/js/**
            src/IgniteUI.Blazor.GridLite/wwwroot/css/themes/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack and sign package
    needs: sign-assemblies
    runs-on: windows-latest
    timeout-minutes: 20
    environment: NuGet Deploy
    permissions:
      contents: read
      id-token: write
    outputs:
      nupkg-sha256: ${{ steps.digest.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-assemblies
          path: src/IgniteUI.Blazor.GridLite
          digest-mismatch: error

      # Pack re-resolves package assets whenever the downloaded obj cache is treated as stale, and
      # then needs the packages on this runner. Restoring is not a rebuild: the signed DLLs stand.
      - name: Restore .NET dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # Repository url and commit are passed explicitly so the nuspec never carries a commit
      # without a url (or vice versa) depending on what the checkout leaves in .git.
      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          -p:PackageVersion=${{ env.VERSION }}
          -p:RepositoryUrl=${{ env.REPOSITORY_URL }}
          -p:RepositoryType=git
          -p:RepositoryCommit=${{ github.sha }}
          -o "${{ github.workspace }}/artifacts"

      # The gate that runs on the actual shipped bytes: bin/ output was already checked once, but
      # packing only re-zips it, so this re-validates both signals against the extracted nupkg
      # instead of trusting that pack couldn't have picked up something else.
      - name: Validate packaged assembly signatures
        shell: pwsh
        run: >
          .github/scripts/Assert-PackageSignatures.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedPublicKeyPath "${{ env.EXPECTED_PUBLIC_KEY_PATH }}"
          -ExpectedCertificateSha256Path "${{ env.EXPECTED_CERT_SHA256_PATH }}"
          -WorkingDirectory "${{ runner.temp }}/package-signature-validation"

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/artifacts"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        shell: pwsh
        run: >
          .github/scripts/Assert-NuGetSignature.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedCertificateSha256Path "${{ env.EXPECTED_CERT_SHA256_PATH }}"

      # This digest is the identity every downstream job re-checks before acting on the package.
      - name: Record package digest
        id: digest
        shell: pwsh
        run: >
          .github/scripts/Get-PackageDigest.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -WriteChecksumFile
          -GitHubOutputName 'nupkg-sha256'
          -SummaryTitle 'Signed package digest'

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-signed
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  # Advisory by design. A finding is annotated and attached to the release as evidence, but never
  # holds up the publish. Task scope is limited to publish.yml, so there is no PR-time blocking
  # dependency-review job pairing this one yet.
  dependency-scan:
    name: Scan dependencies
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Scan NuGet dependencies
        shell: pwsh
        run: >
          .github/scripts/Invoke-DependencyScan.ps1
          -ProjectPath "${{ env.PROJECT_PATH }}"
          -OutputDirectory "${{ github.workspace }}/artifacts/dependency-scan"
          -PackageId "${{ env.PACKAGE_ID }}"
          -Version "$env:VERSION"

      - name: Upload dependency scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-scan
          path: artifacts/dependency-scan/*
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: Generate SBOM and attest
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attested-sha256: ${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify signed package digest
        shell: pwsh
        run: >
          .github/scripts/Get-PackageDigest.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedSha256 "${{ needs.pack.outputs.nupkg-sha256 }}"

      - name: Restore .NET dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # sbom-tool's component detector needs node_modules to see the JavaScript dependency graph too.
      - name: Restore JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Generate SBOMs
        shell: pwsh
        run: >
          .github/scripts/New-Sbom.ps1
          -PackageId "${{ env.PACKAGE_ID }}"
          -PackageVersion "$env:VERSION"
          -BuildDropPath "${{ github.workspace }}/artifacts"
          -BuildComponentPath "${{ github.workspace }}/${{ env.PROJECT_DIR }}"
          -OutputRoot "${{ runner.temp }}/sbom"
          -LicenseTimeoutSeconds ${{ env.SBOM_LICENSE_TIMEOUT_SECONDS }}

      - name: Verify SBOM output
        shell: pwsh
        run: >
          .github/scripts/Assert-Sbom.ps1
          -OutputRoot "${{ runner.temp }}/sbom"
          -ExpectedPackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"

      # CycloneDX reads licences and authors from each package's own nuspec, so it fills the fields the
      # ClearlyDefined-backed SPDX documents leave as NOASSERTION whenever that service is degraded.
      - name: Generate CycloneDX SBOM
        shell: pwsh
        env:
          GH_TOKEN_FOR_LICENSES: ${{ github.token }}
        run: >
          .github/scripts/New-CycloneDxSbom.ps1
          -ProjectPath "${{ env.PROJECT_PATH }}"
          -PackageId "${{ env.PACKAGE_ID }}"
          -PackageVersion "$env:VERSION"
          -OutputDirectory "${{ runner.temp }}/sbom/cyclonedx"
          -GitHubBearerToken "$env:GH_TOKEN_FOR_LICENSES"

      # An attestation binds to a digest rather than a path, so the bytes are re-hashed here and that
      # value is what gets attested, re-checked before publishing, and reported on the release.
      - name: Reverify package before attestation
        id: verify-before-attestation
        shell: pwsh
        run: >
          .github/scripts/Get-PackageDigest.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedSha256 "${{ needs.pack.outputs.nupkg-sha256 }}"
          -FailureMessage 'Package changed before attestation.'
          -GitHubOutputName 'nupkg-sha256'

      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

      # actions/attest derives the predicate from an SPDX 2.x or CycloneDX document; SPDX 3.0 ships as evidence only.
      - name: Attest SPDX SBOM
        id: attest-sbom-spdx
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}
          sbom-path: ${{ runner.temp }}/sbom/_manifest/spdx_2.2/manifest.spdx.json

      # Distinct predicate type from the SPDX attestation, so both bind to the same digest without colliding.
      - name: Attest CycloneDX SBOM
        id: attest-sbom-cyclonedx
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}
          sbom-path: ${{ runner.temp }}/sbom/cyclonedx/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.cdx.json

      - name: Collect attestation bundles
        shell: pwsh
        run: >
          .github/scripts/Copy-AttestationBundles.ps1
          -ProvenanceBundlePath "${{ steps.attest-provenance.outputs.bundle-path }}"
          -SpdxBundlePath "${{ steps.attest-sbom-spdx.outputs.bundle-path }}"
          -CycloneDxBundlePath "${{ steps.attest-sbom-cyclonedx.outputs.bundle-path }}"
          -Destination "${{ runner.temp }}/sbom/attestations"
          -ProvenanceUrl "${{ steps.attest-provenance.outputs.attestation-url }}"
          -SpdxUrl "${{ steps.attest-sbom-spdx.outputs.attestation-url }}"
          -CycloneDxUrl "${{ steps.attest-sbom-cyclonedx.outputs.attestation-url }}"

      - name: Upload SBOM and attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/**
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It restores nothing and compiles nothing; its checkout is a
  # scripts-only sparse one so the publish gate itself is version-controlled and reviewable.
  publish:
    name: Publish to NuGet.org
    needs: [pack, sbom]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: NuGet Deploy
    permissions:
      id-token: write

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            eng/IG.authenticode-certificates.sha256
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify the package that was packed, signed, and attested
        shell: pwsh
        run: >
          .github/scripts/Get-PackageDigest.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedSha256 "${{ needs.pack.outputs.nupkg-sha256 }}","${{ needs.sbom.outputs.attested-sha256 }}"
          -FailureMessage 'Refusing to publish.'

      - name: Validate NuGet package signature
        shell: pwsh
        run: >
          .github/scripts/Assert-NuGetSignature.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedCertificateSha256Path "${{ env.EXPECTED_CERT_SHA256_PATH }}"

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      # Refuses to publish over an existing version instead of using --skip-duplicate: a full rerun
      # produces newly signed bytes, so skipping the duplicate would attach this run's SBOM,
      # attestations and checksum to a release whose published package is a different build.
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          .github/scripts/Publish-NuGetPackage.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -PackageId "${{ env.PACKAGE_ID }}"
          -Version "$env:VERSION"

  attach-to-release:
    name: Attach release evidence
    needs: [pack, sbom, dependency-scan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Download SBOM and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Download dependency scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-scan
          path: evidence/dependency-scan

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKAGE_ID: IgniteUI.Blazor.GridLite
        run: |
          set -euo pipefail

          (cd sbom/_manifest/spdx_2.2 && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-2.2.zip" .)
          (cd sbom/_manifest/spdx_3.0 && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-3.0.zip" .)
          (cd evidence/dependency-scan && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.dependency-scan.zip" .)

          gh release upload "$TAG" --clobber -R "${{ github.repository }}" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg.sha256" \
            "${PACKAGE_ID}.${TAG}.spdx-2.2.zip" \
            "${PACKAGE_ID}.${TAG}.spdx-3.0.zip" \
            "${PACKAGE_ID}.${TAG}.dependency-scan.zip" \
            "sbom/cyclonedx/${PACKAGE_ID}.${TAG}.cdx.json" \
            "sbom/cyclonedx/${PACKAGE_ID}.${TAG}.cdx.json.sha256" \
            "sbom/attestations/provenance.sigstore.json" \
            "sbom/attestations/sbom-spdx.sigstore.json" \
            "sbom/attestations/sbom-cyclonedx.sigstore.json"

